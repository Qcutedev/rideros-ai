# Local development stack: PostgreSQL + PostGIS and the FastAPI backend.
#   copy .env.example .env    # then replace every CHANGE-ME
#   docker compose up --build
name: rideros

services:
  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rideros}
      POSTGRES_USER: ${POSTGRES_USER:-rideros}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/docker
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      cv:
        condition: service_started
    environment:
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rideros}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rideros}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # RoadContext report photos (re-encoded JPEGs, no EXIF). Set ROAD_IMAGE_DIR= to turn uploads off.
      ROAD_IMAGE_DIR: ${ROAD_IMAGE_DIR-/data/road_images}
      # Photo classifier (background, suggestion only). Set CV_SERVICE_URL= to turn it off.
      CV_SERVICE_URL: ${CV_SERVICE_URL-http://cv:8100}
    volumes:
      - road-images:/data/road_images
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"

  # Shared rate-limit store for tests (tests/api/test_rate_limit_storage.py) and for trying the
  # production setup locally. The dev backend keeps the in-memory limiter (one worker).
  valkey:
    image: valkey/valkey:8.1.4-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${VALKEY_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Photo classifier (Phase 5). Internal only: no published port, the backend calls it on this network.
  cv:
    build:
      context: ./cv_service
    environment:
      # cv_service/artifacts is mounted read-only. Set CV_MODEL_DIR= to run without the model (503).
      CV_MODEL_DIR: ${CV_MODEL_DIR-/models/road_cv/1.0.0}
      CV_THREADS: ${CV_THREADS:-1}
    volumes:
      - ./cv_service/artifacts:/models:ro

volumes:
  db-data:
  road-images:
