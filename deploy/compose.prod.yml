# RiderOS AI production stack (Phase 7, docs/DEPLOYMENT.md).
#   cp deploy/prod.env.example deploy/.env      # then replace every CHANGE-ME
#   docker compose -f deploy/compose.prod.yml up -d --build
# Only Caddy publishes ports (80/443). The model artifacts are copied to the server with scp and
# mounted read-only; they are never part of the repository or an image (D4).
name: rideros-prod

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        # Fixed, so the backend can trust X-Forwarded-For from this address only (FORWARDED_ALLOW_IPS).
        ipv4_address: 172.30.0.10

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      cv:
        condition: service_started
    environment:
      ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rideros}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rideros}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      # Two workers; the rate-limit counts are shared through Valkey (settings refuse memory:// here).
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      RATE_LIMIT_STORAGE_URL: redis://valkey:6379/0
      # uvicorn applies X-Forwarded-For only from Caddy; other peers keep their own address.
      FORWARDED_ALLOW_IPS: 172.30.0.10
      MODEL_DIR: /artifacts
      ACTIVE_MODEL_NAME: ${ACTIVE_MODEL_NAME:-pickup_o2p}
      ACTIVE_MODEL_VERSION: ${ACTIVE_MODEL_VERSION:-1.0.0}
      RESTAURANT_STATS_DIR: /artifacts/restaurant_stats/${ACTIVE_MODEL_VERSION:-1.0.0}
      ROAD_IMAGE_DIR: /data/road_images
      CV_SERVICE_URL: http://cv:8100
    volumes:
      - ${ARTIFACTS_DIR:?set ARTIFACTS_DIR}/ml:/artifacts:ro
      - road-images:/data/road_images
    networks:
      edge:
        ipv4_address: 172.30.0.20
      internal: {}

  db:
    # postgis/postgis publishes amd64 only; this builds the same PostGIS 3 packages (PGDG) for arm64 too.
    build:
      context: ./db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rideros}
      POSTGRES_USER: ${POSTGRES_USER:-rideros}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      internal: {}

  # Shared rate-limit counters only (keys expire with their window), so nothing is persisted.
  valkey:
    image: valkey/valkey:8.1.4-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb",
              "--maxmemory-policy", "volatile-ttl"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      internal: {}

  cv:
    build:
      context: ../cv_service
    restart: unless-stopped
    environment:
      CV_MODEL_DIR: /models/road_cv/${CV_MODEL_VERSION:-1.0.0}
      CV_THREADS: ${CV_THREADS:-2}
    volumes:
      - ${ARTIFACTS_DIR:?set ARTIFACTS_DIR}/cv:/models:ro
    networks:
      internal: {}

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  # No route out: the database, Valkey and the classifier need no internet access.
  internal:
    internal: true

volumes:
  db-data:
  road-images:
  caddy-data:
  caddy-config:
