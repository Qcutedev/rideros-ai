[project]
name = "rideros-cv"
version = "0.1.0"
description = "RiderOS AI - road photo classifier: training pipeline (training/) and the POST /classify service (app/)"
readme = "README.md"
requires-python = ">=3.14,<3.15"
# Runtime = what the service needs to load the exported model and answer /classify.
# torch/torchvision come from the PyTorch indexes below (CUDA on Windows for training, CPU on Linux for
# the docker image), so the service image carries no CUDA libraries.
dependencies = [
    "torch==2.15.0",
    "torchvision==0.29.2",
    "pillow>=12.0",
    "fastapi>=0.120",
    "uvicorn>=0.38",
    "pydantic-settings>=2.11",
    "python-multipart>=0.0.20",
]

[dependency-groups]
train = [
    "numpy>=2.1",
    "matplotlib>=3.10",
]
dev = [
    "pytest>=8.4",
    "httpx>=0.28",
    "ruff>=0.14",
]

[tool.uv]
default-groups = ["dev", "train"]
# Not a library: app/ and training/ run from this folder (`python -m training ...`, `uvicorn app.main:app`).
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu132", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu132", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = [
    "artifact: requires a trained model in cv_service/artifacts (skipped if absent)",
]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File"]

[tool.ruff.lint.isort]
known-first-party = ["app", "training"]
