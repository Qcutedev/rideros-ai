# Continuous integration: the same gates as scripts/regression.ps1, minus the emulator E2E run
# (flutter drive needs a device; run `.\scripts\regression.ps1 -E2E` locally for that).
#
# Datasets and trained model artifacts are never in the repository (D1/D4), so tests that need
# them skip themselves here (backend tests/api/test_real_artifact.py, ml tests/test_artifact.py).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  FLUTTER_VERSION: "3.47.0"
  BACKEND_COVERAGE_GATE: "96"
  MOBILE_COVERAGE_GATE: "94.7"

jobs:
  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      db:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: rideros
          POSTGRES_USER: rideros
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rideros -d rideros"
          --health-interval 5s --health-timeout 3s --health-retries 20
      valkey:
        image: valkey/valkey:8.1.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://rideros:ci-only-password@127.0.0.1:5432/rideros_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - name: pytest (coverage gate)
        run: >-
          uv run --locked pytest
          --cov=app/modules --cov=app/core --cov-report=term:skip-covered
          --cov-fail-under=${{ env.BACKEND_COVERAGE_GATE }}

  python-ml:
    name: ${{ matrix.project }} (ruff + pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [ml, cv_service]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: ${{ matrix.project }}/uv.lock
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest

  mobile:
    name: mobile (analyze + test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - run: flutter test --coverage
      - name: coverage gate (lib/, generated code excluded)
        run: |
          awk -v gate="$MOBILE_COVERAGE_GATE" '
            /^SF:/ { skip = ($0 ~ /\.g\.dart$|\.freezed\.dart$|(^|\/)lib\/l10n\//) }
            /^LF:/ && !skip { found += substr($0, 4) }
            /^LH:/ && !skip { hit += substr($0, 4) }
            END {
              if (found == 0) { print "no coverage data"; exit 1 }
              pct = 100 * hit / found
              printf "mobile lib/ coverage: %.2f%% (%d/%d lines), gate %s%%\n", pct, hit, found, gate
              exit (pct + 0 >= gate + 0) ? 0 : 1
            }' coverage/lcov.info

  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: scan
        # The container user differs from the checkout owner, so mark the repo safe for git.
        run: >-
          docker run --rm -v "$PWD:/repo"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          zricethezav/gitleaks:v8.30.0 git /repo --redact --verbose
