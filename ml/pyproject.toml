[project]
name = "rideros-ml"
version = "0.1.0"
description = "RiderOS AI - offline ML pipeline (dataset validation, training, evaluation, export)"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.1",
    "pyarrow>=18.0",
    "scikit-learn>=1.6",
    "xgboost>=3.0",
    "catboost>=1.2.8",
    "optuna>=4.0",
    "matplotlib>=3.10",
    "joblib>=1.4",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
rideros-ml = "rideros_ml.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rideros_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "artifact: requires a trained model artifact in ml/artifacts (skipped if absent)",
    "data: requires the downloaded dataset in ml/data/raw (skipped if absent)",
    "slow: takes more than ~30 s (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
