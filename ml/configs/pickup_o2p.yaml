# Pickup Intelligence - Order-to-Pickup Time model (Decision D1: Meituan INFORMS TSL)
# Target is NOT food preparation time and NOT rider waiting time (see docs/DATASET_ANALYSIS.md 4.7).

dataset:
  name: meituan_informs_tsl
  repo: meituan/Meituan-INFORMS-TSL-Research-Challenge
  commit: 1f9b4288cee5a78d1e5da007fc306bbaa662fc6d   # pinned (repo HEAD on 2025-12-03)
  license_file: License.txt
  waybill_zip: all_waybill_info_meituan_0322.csv.zip
  waybill_csv: all_waybill_info_meituan_0322.csv
  # SHA-256 pins. If a pin is null, download records the hash and fails closed until it is pinned here.
  # Pinned 2026-11-05 after manual review of License.txt (text identical to the Phase 0 review).
  expected_sha256:
    License.txt: 469f53d91ee9d0dbdf7b60146bfdbcee57732db4f2b6bb13c41bfdf28c30daab
    all_waybill_info_meituan_0322.csv.zip: 38b51431a12dd7e73deb4fc750b1275067fbc29cfce2c4b4492339738c988ce2
  expected_rows: 654343          # from the official "Background and Data Description" (Table 1/2)
  local_utc_offset_hours: 8      # China Standard Time, no DST. Verified against is_weekend in validation.

target:
  name: order_to_pickup_min
  # Decided 2026-11-05 from TRAIN-period tails only (reports/data_validation/VALIDATION_REPORT.md):
  #   < 1 min: 23 orders (pickup < 60 s after order creation - implausible); > 120 min: 19 orders (stuck orders).
  #   Together ~0.01% of train orders. Same rule is applied to every split.
  min_minutes: 1.0
  max_minutes: 120.0

split:                           # by local date of platform_order_time (t0)
  train_last_date: "2022-10-22"
  val_date: "2022-10-23"
  test_date: "2022-10-24"

features:
  # Deployable set: every value is known at t0 AND obtainable by the RiderOS backend at inference time.
  categorical: [poi_id, da_id]
  numeric: [hour, minute_sin, minute_cos, is_weekend]
  # Ablation only (known at t0 on the platform, NOT available to RiderOS): real-time load + delivery distance.
  ablation_extra: [poi_orders_last_30m, da_orders_last_30m, poi_open_orders, distance_km]

training:
  seed: 42
  xgboost_trials: 20
  catboost_trials: 15
  random_forest:
    n_estimators: 200
    min_samples_leaf: 20
    max_features: 0.6
    max_samples: 0.5

conformal:
  alpha: 0.2                     # 80% prediction interval

model:
  name: pickup_o2p
  version: 1.0.0

analytics:
  min_orders_for_stats: 30
