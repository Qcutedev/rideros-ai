[project]
name = "rideros-backend"
version = "0.1.0"
description = "RiderOS AI - FastAPI backend (modular monolith)"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.120",
    "uvicorn>=0.38",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "email-validator>=2.3",
    "sqlalchemy[asyncio]>=2.0.44",
    "asyncpg>=0.30",
    "alembic>=1.17",
    "pwdlib[argon2]>=0.3",
    "pyjwt>=2.10",
    "structlog>=25.4",
    "tzdata>=2025.2",
    "geoalchemy2>=0.18",
    "limits>=5.0",
    # ML serving (P2c). rideros-ml provides the classes pipeline.joblib references plus the feature
    # builder. The libraries below must equal the versions in the artifact's metadata.json
    # ("libraries"); app/ml/registry.py refuses to load the model otherwise.
    "rideros-ml",
    "scikit-learn==1.9.1",
    "xgboost==3.4.1; sys_platform != 'linux'",
    "xgboost-cpu==3.4.1; sys_platform == 'linux'",
    "pandas==3.1.1",
    "numpy==2.5.4",
    "joblib==1.6.0",
    "pillow>=12.0",
    # Trend significance test (profit/trend_analysis.py); already installed with scikit-learn.
    "scipy>=1.18",
    "python-multipart>=0.0.20",
    # Calls the photo classifier (cv_service) from a background task.
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7.0",
    "ruff>=0.14",
    "python-dotenv>=1.2.4",
]

[tool.uv.sources]
rideros-ml = { path = "../ml" }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
