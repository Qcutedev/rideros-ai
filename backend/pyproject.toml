[project]
name = "rideros-backend"
version = "0.1.0"
description = "RiderOS AI - FastAPI backend (modular monolith)"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.120",
    "uvicorn>=0.38",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "email-validator>=2.3",
    "sqlalchemy[asyncio]>=2.0.44",
    "asyncpg>=0.30",
    "alembic>=1.17",
    "pwdlib[argon2]>=0.3",
    "pyjwt>=2.10",
    "structlog>=25.4",
    "tzdata>=2025.2",
    "geoalchemy2>=0.18",
    "limits>=5.0",
    # Shared rate-limit store (RATE_LIMIT_STORAGE_URL=redis://…); talks to Valkey in production.
    "redis>=6.4",
    # Work Patterns (profit/patterns.py: K-Means, silhouette, ARI).
    "scikit-learn>=1.9.1",
    "numpy>=2.5.4",
    # Trend significance test (profit/trend_analysis.py); already installed with scikit-learn.
    "scipy>=1.18",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7.0",
    # Test client (ASGITransport) and the perf script (perf/run.py).
    "httpx>=0.28",
    "ruff>=0.14",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
